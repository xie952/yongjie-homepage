<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>常用英雄 &amp; 武器 · 3D 渐变轮播</title>
<!-- 内联空图标：避免浏览器请求 /favicon.ico 造成 404（自检要求控制台零报错） -->
<link rel="icon" href="data:," />
<!--
  常用英雄 & 武器 —— 单文件版（原生 HTML/CSS/JS，零依赖，双击即可预览）
  版式参考：React Bits Pro「Gradient Carousel」的 3D 渐变轮播语言
  规格落地：7 卡单行 · 居中放大 · 两侧 3D 旋转+后退+缩小 · 距离>3 隐藏 · 首尾循环
   · perspective 1600px / origin 50% 46% / maxRotation 26deg / maxDepth 210px / minScale .8 / 越远越透明
   · 步长 = 卡宽+间距 · 桌面 360×392 gap26 / ≤900 314×352 gap18 / ≤560 276×320 gap14
   · 圆角 18 / 内边距 24 / 头像 124(96/84) / 皮肤缩略图 84(72) / 舞台高 = 卡高 + 96
   · 背景 3 光斑 blur(28px) saturate(1.15) + 居中卡主题色 700ms 过渡 + 3px 噪点 overlay .35
   · 鼠标视差 rotateX(-4~4deg) / rotateY(-6~6deg)
   · 交互：拖拽>60px 翻页（区分点击/拖拽）· 滚轮 320ms 节流 · ←/→ · 点侧卡居中 · 圆点 · 箭头 · 循环无死角
   ★ 头像与皮肤缩略图为占位样式；替换真实素材的位置见 [资源替换位置] 注释。
-->
<style>
  :root {
    --gold: #d8b56a; --gold-bright: #e8c877; --gold-deep: #a98a4a; --bronze: #b0642a;
    --page-bg: #0b0a09; --text: #e8e2d4; --muted: #8f8878; --line: rgba(216, 181, 106, .18);
    --font-serif: "Noto Serif SC", "Songti SC", STSong, serif;
    --font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100%; background: var(--page-bg); color: var(--text);
         font-family: var(--font-sans); display: grid; place-items: center; padding: 48px 24px; }
  .loadout { width: min(1280px, 100%); }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 18px; }
  .head h2 { margin: 0; font-family: var(--font-serif); font-size: 26px; font-weight: 600; letter-spacing: .12em; color: var(--gold-bright); }
  .legend { display: flex; align-items: center; gap: 18px; font-size: 13px; color: var(--muted); letter-spacing: .08em; }
  .legend-item { display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot--hero { background: var(--gold); box-shadow: 0 0 10px rgba(216, 181, 106, .65); }
  .dot--weapon { background: var(--bronze); box-shadow: 0 0 10px rgba(176, 100, 42, .6); }
  /* ===== 舞台 ===== */
  .stage {
    position: relative;
    height: calc(var(--card-h) + 96px);
    perspective: 1600px;
    perspective-origin: 50% 46%;
    overflow: hidden; border-radius: 22px; border: 1px solid var(--line); background: #0d0c0a;
    --card-w: 360px; --card-h: 392px; --gap: 26px; --avatar: 124px; --thumb: 84px; --pad: 24px; --radius: 18px;
    cursor: grab; user-select: none; -webkit-user-select: none; touch-action: pan-y;
  }
  .stage.is-dragging { cursor: grabbing; }
  .stage:focus-visible { outline: 2px solid rgba(216, 181, 106, .55); outline-offset: 4px; }
  @media (max-width: 900px) { .stage { --card-w: 314px; --card-h: 352px; --gap: 18px; --avatar: 96px; --thumb: 72px; } }
  @media (max-width: 560px) {
    .stage { --card-w: 276px; --card-h: 320px; --gap: 14px; --avatar: 84px; --thumb: 72px; --pad: 18px; --radius: 16px; }
    .head h2 { font-size: 20px; }
  }
  .ambient { position: absolute; inset: -10%; filter: blur(28px) saturate(1.15); pointer-events: none; z-index: 0; }
  .blob { position: absolute; border-radius: 50%;
          background: radial-gradient(closest-side, currentColor, transparent 72%);
          transition: color 700ms var(--ease); opacity: .5; }
  .blob--a { width: 62%; height: 78%; left: 4%; top: -6%; }
  .blob--b { width: 56%; height: 72%; left: 34%; top: 12%; opacity: .42; }
  .blob--c { width: 50%; height: 66%; right: 2%; top: -2%; opacity: .36; }
  .grain { position: absolute; inset: 0; opacity: .35; mix-blend-mode: overlay; pointer-events: none;
           background-image: radial-gradient(rgba(255, 255, 255, .5) 1px, transparent 1px); background-size: 3px 3px; }
  .track { position: absolute; inset: 0; transform-style: preserve-3d;
           transform: rotateX(0deg) rotateY(0deg) translateX(0px); transition: transform 260ms var(--ease); z-index: 1; }
  .stage.is-dragging .track { transition: none; }
  /* ===== 卡片 ===== */
  .card {
    position: absolute; left: 50%; top: 50%;
    width: var(--card-w); height: var(--card-h); padding: var(--pad);
    border-radius: var(--radius);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    background: linear-gradient(180deg, #241f18, #17140f);
    display: flex; flex-direction: column;
    transform-style: preserve-3d; will-change: transform, opacity;
    transition: transform 620ms var(--ease), opacity 620ms var(--ease), border-color 400ms ease, box-shadow 400ms ease;
    box-shadow: 0 26px 60px -28px rgba(0, 0, 0, .8);
    overflow: hidden; cursor: pointer;
    --accent: #d8b56a; --accent-bright: #e8c877; --accent-deep: #a98a4a;
  }
  .stage.is-dragging .card { transition: none; }
  .card[data-theme="red"]    { --accent: #c8483a; --accent-bright: #e0796a; --accent-deep: #8f2a1f; }
  .card[data-theme="weapon"] { --accent: #d8b56a; --accent-bright: #e8c877; --accent-deep: #b0642a; }
  .card.is-active { border-color: var(--accent-bright);
    box-shadow: 0 30px 70px -26px rgba(0, 0, 0, .85), 0 0 42px color-mix(in srgb, var(--accent-bright) 34%, transparent); }
  .card[hidden] { display: none; }
  .badge { position: absolute; top: calc(var(--pad) - 4px); right: calc(var(--pad) - 4px);
           padding: 5px 11px; border-radius: 999px; line-height: 1;
           border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
           color: var(--accent-bright); font-size: 11px; letter-spacing: .18em; }
  /* 左下角大号序号：与底部皮肤子卡同排（原为绝对定位水印，实测会压住「使用率」文字，故改为随流） */
  .foot { margin-top: auto; display: flex; align-items: flex-end; gap: 12px; }
  .idx { flex: 0 0 auto; font-family: var(--font-serif); font-size: 46px; font-weight: 700; line-height: .92;
         color: color-mix(in srgb, var(--accent) 34%, transparent); pointer-events: none; }
  .persona { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 4px; }
  .avatar { width: var(--avatar); height: var(--avatar); border-radius: 50%;
            border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
            background: repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 2px, transparent 2px 7px),
                        radial-gradient(circle at 50% 32%, color-mix(in srgb, var(--accent) 22%, transparent), rgba(0,0,0,.4));
            display: grid; place-items: center; font-size: 11px; letter-spacing: .12em;
            color: color-mix(in srgb, var(--accent) 60%, transparent); }
  .name { margin: 0; font-family: var(--font-serif); font-size: 22px; letter-spacing: .08em; color: var(--text); }
  .usage { margin-top: 14px; }
  .usage-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 7px; }
  .usage-head span { font-size: 12px; letter-spacing: .16em; color: var(--muted); }
  .usage-head b { font-family: var(--font-serif); font-size: 20px; font-weight: 600; color: var(--accent-bright); }
  .bar { height: 6px; border-radius: 999px; background: rgba(255,255,255,.07); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 999px; transition: width 620ms var(--ease);
           background: linear-gradient(90deg, var(--accent-deep), var(--accent-bright)); }
  .skin { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px;
          border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent); background: rgba(255,255,255,.028); }
  .thumb { width: var(--thumb); height: var(--thumb); flex: 0 0 auto; border-radius: 10px;
           border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
           background: repeating-linear-gradient(-45deg, rgba(255,255,255,.03) 0 2px, transparent 2px 7px),
                       radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--accent) 26%, transparent), rgba(0,0,0,.4));
           display: grid; place-items: center; font-size: 10px; letter-spacing: .1em;
           color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .skin-meta { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  .skin-name { font-size: 13.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grade { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--accent-bright); }
  .grade::before { content: ""; width: 2px; height: 13px; border-radius: 2px; background: var(--accent); }
  /* ===== 控制区 ===== */
  .controls { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 20px; }
  .arrow { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%;
           border: 1px solid var(--line); background: rgba(20, 17, 13, .7); color: var(--gold); cursor: pointer;
           transition: border-color 200ms ease, color 200ms ease, transform 200ms ease; }
  .arrow:hover { border-color: rgba(216, 181, 106, .6); color: var(--gold-bright); }
  .arrow:active { transform: scale(.94); }
  .dots { display: flex; align-items: center; gap: 8px; }
  .dots button { width: 8px; height: 8px; padding: 0; border: none; border-radius: 999px;
                 background: rgba(232, 226, 212, .26); cursor: pointer;
                 transition: width 260ms var(--ease), background 260ms ease; }
  .dots button.is-active { width: 22px; background: var(--gold); }
  @media (prefers-reduced-motion: reduce) { .card, .bar i, .blob, .track, .dots button { transition: none !important; } }
</style>
</head>
<body>
<section class="loadout">
  <header class="head">
    <h2>常用英雄 &amp; 武器</h2>
    <!-- 标题右侧图例：金点 英雄 ×3 / 橙点 武器 ×4 -->
    <div class="legend">
      <span class="legend-item"><i class="dot dot--hero"></i>英雄 ×3</span>
      <span class="legend-item"><i class="dot dot--weapon"></i>武器 ×4</span>
    </div>
  </header>

  <div class="stage" id="stage" tabindex="0" role="group" aria-roledescription="carousel" aria-label="常用英雄与武器">
    <!-- 环境渐变：3 个径向光斑（颜色随居中卡主题色过渡）+ 3px 噪点 -->
    <div class="ambient" aria-hidden="true">
      <span class="blob blob--a" data-blob="0"></span>
      <span class="blob blob--b" data-blob="1"></span>
      <span class="blob blob--c" data-blob="2"></span>
      <span class="grain"></span>
    </div>
    <div class="track" id="track"></div>
  </div>

  <div class="controls">
    <button class="arrow" id="prev" type="button" aria-label="上一张">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="dots" id="dots" role="tablist" aria-label="卡片导航"></div>
    <button class="arrow" id="next" type="button" aria-label="下一张">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</section>

<script>
(function () {
  'use strict';

  /* ===== 数据：英雄 3 + 武器 4 ===== */
  var CARDS = [
    { kind: '英雄', theme: 'hero',   idx: '01', name: '哈迪',   usage: 83, skin: { name: '斩神·米迦勒',    grade: '极品' }, bg: ['#e8c877', '#e0592b', '#6b4e1f'] },
    { kind: '英雄', theme: 'hero',   idx: '02', name: '殷紫萍', usage: 10, skin: { name: '墨染千秋·青玉案', grade: '极品' }, bg: ['#e8c877', '#e0592b', '#6b4e1f'] },
    { kind: '英雄', theme: 'red',    idx: '03', name: '沈妙',   usage: 8,  skin: { name: '星辉魔纱',      grade: '神品' }, bg: ['#e0796a', '#8f2a1f', '#3d1712'] },
    { kind: '武器', theme: 'weapon', idx: '04', name: '拳刃',   usage: 28, skin: { name: '甜心震荡',      grade: '极品' }, bg: ['#d8b56a', '#b0642a', '#4d3418'] },
    { kind: '武器', theme: 'weapon', idx: '05', name: '扇',     usage: 22, skin: { name: '折寒英',        grade: '极品' }, bg: ['#d8b56a', '#b0642a', '#4d3418'] },
    { kind: '武器', theme: 'weapon', idx: '06', name: '长棍',   usage: 14, skin: { name: '打狗棒',        grade: '极品' }, bg: ['#d8b56a', '#b0642a', '#4d3418'] },
    { kind: '武器', theme: 'weapon', idx: '07', name: '斩马刀', usage: 9,  skin: { name: '劫涛·潮',       grade: '极品' }, bg: ['#d8b56a', '#b0642a', '#4d3418'] }
  ];

  /* ===== 3D 参数（规格） ===== */
  var MAX_ROT = 26;         // maxRotationDegrees
  var MAX_DEPTH = 210;      // maxDepthPx
  var MIN_SCALE = 0.8;      // minScale
  var MAX_DIST = 3;         // 超出 3 张距离的卡隐藏
  var DRAG_THRESHOLD = 60;  // 拖拽超过 60px 翻页
  var WHEEL_THROTTLE = 320; // 滚轮节流 320ms

  var stage = document.getElementById('stage');
  var track = document.getElementById('track');
  var dotsBox = document.getElementById('dots');
  var blobs = Array.prototype.slice.call(document.querySelectorAll('.blob'));
  var cards = [];
  var active = 0;
  var dragged = false;

  /* ===== 建卡（结构自上而下：角标 → 序号 → 头像+名称 → 使用率 → 皮肤子卡） ===== */
  CARDS.forEach(function (c, i) {
    var el = document.createElement('article');
    el.className = 'card';
    el.dataset.theme = c.theme;
    el.setAttribute('aria-label', c.kind + ' ' + c.name + '，使用率 ' + c.usage + '%');
    el.innerHTML =
      '<span class="badge">' + c.kind + '</span>' +
      '<div class="persona">' +
        '<!-- [资源替换位置] 头像：把下面这个 span 换成 <img class="avatar" src="图片URL" alt="' + c.name + '" /> -->' +
        '<span class="avatar">头像</span>' +
        '<h3 class="name">' + c.name + '</h3>' +
      '</div>' +
      '<div class="usage">' +
        '<div class="usage-head"><span>使用率</span><b>' + c.usage + '%</b></div>' +
        '<div class="bar"><i style="width:' + c.usage + '%"></i></div>' +
      '</div>' +
      '<div class="foot">' +
        '<span class="idx">' + c.idx + '</span>' +
        '<div class="skin">' +
          '<!-- [资源替换位置] 皮肤缩略图：把下面这个 span 换成 <img class="thumb" src="图片URL" alt="' + c.skin.name + '" /> -->' +
          '<span class="thumb">皮肤</span>' +
          '<div class="skin-meta">' +
            '<span class="skin-name">' + c.skin.name + '</span>' +
            '<span class="grade">' + c.skin.grade + '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    track.appendChild(el);
    cards.push(el);

    // 点击侧卡使其居中；拖拽后的 click 一律忽略（区分点击与拖拽）
    el.addEventListener('click', function (e) {
      if (dragged) { e.preventDefault(); return; }
      if (i !== active) setActive(i);
    });

    var dot = document.createElement('button');
    dot.type = 'button';
    dot.setAttribute('role', 'tab');
    dot.setAttribute('aria-label', '第 ' + (i + 1) + ' 张：' + c.name);
    dot.addEventListener('click', function () { setActive(i); });
    dotsBox.appendChild(dot);
  });

  /* ===== 布局：位移步长 = 卡宽 + 间距（断点由 CSS 变量给出） ===== */
  function step() {
    var cs = getComputedStyle(stage);
    return parseFloat(cs.getPropertyValue('--card-w')) + parseFloat(cs.getPropertyValue('--gap'));
  }

  function layout() {
    var s = step();
    var n = CARDS.length;
    cards.forEach(function (el, i) {
      var d = ((i - active) % n + n) % n;        // 0..n-1
      if (d > n / 2) d -= n;                      // 折到 -3..3（n=7）
      var ad = Math.abs(d);
      var hide = ad > MAX_DIST;                   // 距离 >3 隐藏（7 张时恒不触发，作通用保护保留）
      if (el.hidden !== hide) el.hidden = hide;
      if (hide) return;

      var t = Math.min(ad, MAX_DIST) / MAX_DIST;  // 0 = 居中，1 = 最远
      var rot = d === 0 ? 0 : -Math.sign(d) * MAX_ROT;   // 两侧卡 3D 旋转（上限 26deg）
      var z = -MAX_DEPTH * t;                            // 沿 Z 后退（最远 210px）
      var scale = 1 - (1 - MIN_SCALE) * t;               // 缩小（最远 0.8）
      var opacity = 1 - 0.55 * t;                        // 越远越透明

      el.style.transform = 'translate(-50%, -50%) translateX(' + (d * s).toFixed(1) + 'px)' +
                           ' translateZ(' + z.toFixed(1) + 'px) rotateY(' + rot.toFixed(2) + 'deg)' +
                           ' scale(' + scale.toFixed(3) + ')';
      el.style.opacity = opacity.toFixed(3);
      el.style.zIndex = String(100 + (MAX_DIST - ad));
      el.classList.toggle('is-active', d === 0);
      if (d === 0) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current');
    });
  }

  /* ===== 居中卡主题色 → 背景三光斑（700ms 过渡由 CSS 负责） ===== */
  function applyAmbient() {
    var bg = CARDS[active].bg;
    blobs.forEach(function (b, i) { b.style.color = bg[i] || bg[0]; });
  }

  function updateDots() {
    Array.prototype.forEach.call(dotsBox.children, function (d, i) {
      d.classList.toggle('is-active', i === active);
      d.setAttribute('aria-selected', i === active ? 'true' : 'false');
    });
  }

  function setActive(i) {
    var n = CARDS.length;
    active = ((i % n) + n) % n;   // 首尾循环无死角
    layout(); updateDots(); applyAmbient();
  }

  /* ===== 鼠标视差（可选）：轨道 rotateX(-4~4deg) / rotateY(-6~6deg) ===== */
  var fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  var tiltX = 0, tiltY = 0, dragX = 0;
  function applyTrack() {
    track.style.transform = 'rotateX(' + tiltX.toFixed(2) + 'deg) rotateY(' + tiltY.toFixed(2) + 'deg) translateX(' + dragX.toFixed(1) + 'px)';
  }

  /* ===== 拖拽（>60px 翻页） / 点击区分 / 滚轮节流 / 键盘 ===== */
  var drag = null;
  stage.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    drag = { x: e.clientX, id: e.pointerId }; dragged = false;
    stage.classList.add('is-dragging');
    /* 注意：这里【不能】立刻 setPointerCapture —— 指针捕获会把随后的 click 目标重定向到舞台，
       导致「点击侧卡使其居中」失效（实测：捕获后再点侧卡，active 不变）。
       改为等真正越过 6px 拖拽阈值后再捕获，纯点击路径完全不受影响。 */
  });
  stage.addEventListener('pointermove', function (e) {
    if (!drag) {
      if (fine) {
        var r = stage.getBoundingClientRect();
        tiltY = ((e.clientX - r.left) / r.width - 0.5) * 12;    // -6 ~ 6 deg
        tiltX = -((e.clientY - r.top) / r.height - 0.5) * 8;    // -4 ~ 4 deg
        applyTrack();
      }
      return;
    }
    var dx = e.clientX - drag.x;
    if (!dragged && Math.abs(dx) > 6) {
      dragged = true;
      try { stage.setPointerCapture(drag.id); } catch (err) {}   // 越过阈值才捕获，拖出舞台也不丢事件
    }
    if (dragged) { dragX = dx * 0.35; applyTrack(); }           // 拖拽中的实时跟手反馈
  });
  stage.addEventListener('pointerup', function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.x;
    stage.classList.remove('is-dragging');
    dragX = 0; applyTrack();
    if (dragged && Math.abs(dx) > DRAG_THRESHOLD) setActive(active + (dx < 0 ? 1 : -1));
    drag = null;
    setTimeout(function () { dragged = false; }, 0);            // 让紧随的 click 读到正确的 dragged
  });
  stage.addEventListener('pointercancel', function () {
    drag = null; dragX = 0; stage.classList.remove('is-dragging'); applyTrack();
  });
  stage.addEventListener('pointerleave', function () {
    if (drag) return;
    tiltX = 0; tiltY = 0; applyTrack();
  });

  var wheelLock = 0;
  stage.addEventListener('wheel', function (e) {
    var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (Math.abs(d) < 2) return;
    e.preventDefault();
    var now = Date.now();
    if (now - wheelLock < WHEEL_THROTTLE) return;   // 320ms 节流
    wheelLock = now;
    setActive(active + (d > 0 ? 1 : -1));
  }, { passive: false });

  stage.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); setActive(active - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); setActive(active + 1); }
  });

  document.getElementById('prev').addEventListener('click', function () { setActive(active - 1); });
  document.getElementById('next').addEventListener('click', function () { setActive(active + 1); });

  window.addEventListener('resize', function () { layout(); });
  window.addEventListener('load', function () { layout(); });   // 字体就绪后按最终尺寸再校一次

  /* 初始化 */
  applyTrack();
  setActive(0);
  layout();
})();
</script>
</body>
</html>
